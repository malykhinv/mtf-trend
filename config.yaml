thresholds:
  buy_signal: 0.8
  sell_signal: 0.2
  funding_rate: 0.0003
  basis: 0.5            # Maximum spot–futures basis percentage for entry
  exit_basis: 1.0       # Basis percentage triggering position exit
  volume: 20000000      # Minimum 24h trading volume in USD to ensure liquidity
  liquidity: 0.0
  holding_time: 172800
  volatility: 0.025
  open_interest: 0.0
  min_trade_size: 10    # Minimum trade size in USD
  max_trade_size: 100.0
  spread: 0.005         # Maximum allowed spread percentage
  slippage: 0.003       # Maximum expected slippage per trade
  exit_slippage: 0.005  # Maximum allowed slippage on exit
  deposit_pct: 0.05     # Max fraction of total deposit per trade
risk:
  max_position_size: 100
  max_daily_loss: 50
  max_consecutive_losses: 3
  max_open_positions: 5
  deposit_cap_pct: 0.3
bot:
  poll_interval: 5
  whitelist: "*"          # "*" — включить все доступные символы
  # whitelist:
  #   binance:              # Пример задания списка отдельно для биржи
  #     - BTCUSDT
  #     - ETHUSDT
  #   bybit:
  #     - XRPUSDT
  deposit_size: 100
  positions_file: open_positions.json

paths:
  log: data/funding_bot_log.xlsx
  thresholds: data/optimized_thresholds.joblib
