api:
  api_key: "YOUR_API_KEY"
  api_secret: "YOUR_API_SECRET"

# Symbols to collect OHLCV data for
symbols:
  - "BTC/USDT"
  - "ETH/USDT"

fetcher:
  symbol: "BTC/USDT"
  limit: 1000
  timeframes:
    - "1m"
    - "5m"
    - "1h"

trading_defaults:
  leverage: 1
  margin_mode: "cross"

risk_limits:
  max_position_size: 1000
  daily_loss_limit: 500

data_paths:
  data_dir: "data/"
  log_dir: "logs/"

strategy:
  volume_spike: 2.0

feature_toggles:
  enable_notifications: true
  use_sandbox: false
