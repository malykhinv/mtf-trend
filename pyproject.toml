[project]
name = "anomaly-science"
version = "0.1.0"
description = "Clean scientific rebuild of anomaly-driven crypto anomaly research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "polars>=0.20",
  "pyarrow>=14.0",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "catboost>=1.2",
  "requests>=2.31",
  "tqdm>=4.66",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
