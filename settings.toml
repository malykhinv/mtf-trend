mode = "backtest"

[time]
zone = "Europe/Belgrade"

[logging]
level = "INFO"

[storage]
path = "var/state.xlsx"

[metrics]
atr_period = 14
volume_period = 20
momentum_period = 5

[dedup]
ttl_seconds = 14400
max_records = 1000

[providers.binance]
api_base = "https://fapi.binance.com"
ws_base = "wss://fstream.binance.com/ws"
rate_limit_per_minute = 1200
min_quote_volume = 500000.0

[providers.bybit]
api_base = "https://api.bybit.com"
ws_base = "wss://stream.bybit.com/v5/public/linear"
rate_limit_per_minute = 600
min_quote_volume = 250000.0

[symbols.selection]
min_quote_volume = 5000000.0
quote_suffix = "USDT"
allow = []
deny = []

[thresholds.default]
min_relative_volume = 40.0
max_relative_volume = 200.0
min_atr_mult = 5.0
min_pct_move = 5.0
max_pct_move = 10.0
max_upper_wick_pct = 75.0
max_lower_wick_pct = 50.0
allow_long = true
allow_short = true

[[thresholds.default.metrics]]
name = "atr"
min_value = 5.0

[[thresholds.default.short_pct_move_ranges]]
min = 3.0
max = 5.0

[[thresholds.default.short_pct_move_ranges]]
min = 10.0

[backtest]
enabled = true
timeframe = "15m"
limit = 1500
window = 50

[live]
enabled = false
providers = ["binance", "bybit"]
timeframe = "5m"
window = 50
poll_interval = 10.0
balance_interval = 120.0

[symbols.providers]
default = "binance"
BTCUSDT = "binance"
