[logging]
level = "INFO"

[storage]
path = "var/state.json"

[metrics]
atr_period = 14
volume_period = 20
momentum_period = 5

[dedup]
ttl_seconds = 14400
max_records = 1000

[providers.binance]
api_base = "https://fapi.binance.com"
ws_base = "wss://fstream.binance.com/ws"
rate_limit_per_minute = 1200
min_quote_volume = 500000.0

[providers.bybit]
api_base = "https://api.bybit.com"
ws_base = "wss://stream.bybit.com/v5/public/linear"
rate_limit_per_minute = 600
min_quote_volume = 250000.0

[thresholds.default]
min_relative_volume = 50.0
max_relative_volume = 100000.0
min_atr_mult = 100.0
min_pct_move = 0.0
max_pct_move = 0.0
max_upper_wick_pct = 2.0
max_lower_wick_pct = 1.0
allow_long = true
allow_short = true

[[thresholds.default.metrics]]
name = "atr"
min_value = 50.0

[[thresholds.default.metrics]]
name = "average_volume"
min_value = 100000.0

[[thresholds.default.metrics]]
name = "momentum"
min_abs_value = 100.0

[thresholds.symbols.BTCUSDT]
min_relative_volume = 25.0
max_relative_volume = 200000.0
min_atr_mult = 80.0
min_pct_move = 0.0
max_pct_move = 0.0
max_upper_wick_pct = 2.5
max_lower_wick_pct = 1.0
allow_long = true
allow_short = true
metadata = { timeframe = "15m" }

[[thresholds.symbols.BTCUSDT.metrics]]
name = "atr"
min_value = 25.0

[[thresholds.symbols.BTCUSDT.metrics]]
name = "average_volume"
min_value = 200000.0

[[thresholds.symbols.BTCUSDT.metrics]]
name = "momentum"
min_abs_value = 80.0

[backtest]
enabled = true
symbols = ["BTCUSDT"]
timeframe = "15m"
limit = 200
window = 50

[live]
enabled = false
symbols = ["BTCUSDT"]
provider = "binance"
timeframe = "5m"
window = 50
poll_interval = 10.0
balance_interval = 120.0

[symbols.providers]
default = "binance"
BTCUSDT = "binance"
